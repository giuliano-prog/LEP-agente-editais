name: Migrações Supabase (produção)

# Aplica automaticamente as migrações de supabase/migrations/ no banco Supabase de produção,
# conectando DIRETO ao PostgreSQL (`supabase db push --db-url`) — sem `supabase link` e sem
# token da Management API (ADR-0014).
#
# Quando roda:
#   • a cada push no branch de produção (variável SUPABASE_MIGRATIONS_BRANCH; padrão: main)
#     que altere supabase/migrations/;
#   • manualmente: Actions → "Migrações Supabase (produção)" → Run workflow.
#
# Segredo necessário (recomendado como Environment secret do ambiente "production"):
#   SUPABASE_DB_URL  connection string do Session pooler (porta 5432), com a senha percent-encoded:
#                    Supabase → Project Settings → Database → Connect → Session pooler.
#                    Ex.: postgresql://postgres.<ref>:<senha>@aws-0-<região>.pooler.supabase.com:5432/postgres

on:
  push:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# Nunca rodar duas aplicações ao mesmo tempo, e nunca cancelar uma em andamento.
concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  verify:
    name: Testar migrações (banco descartável)
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.SUPABASE_MIGRATIONS_BRANCH || 'main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Migrações do zero (2x) + testes de permissão
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -qc "create database fresh" -c "create database partial"
          DB_TEST_SHIM=1 DB_URL=postgresql://postgres:postgres@localhost:5432/fresh bash scripts/db-test.sh
      - name: Migrações sobre banco parcialmente migrado à mão
        run: DB_TEST_SHIM=1 DB_TEST_SCENARIO=remoto-parcial DB_URL=postgresql://postgres:postgres@localhost:5432/partial bash scripts/db-test.sh

  deploy:
    name: Aplicar no Supabase de produção
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Conferir segredo e proteger a senha nos logs
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Segredo SUPABASE_DB_URL ausente. Configure em Settings → Environments → production (ver README)."
            exit 1
          fi
          # Mascara a senha (original e decodificada) caso alguma ferramenta imprima partes da URL.
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlsplit, unquote
          url = urlsplit(os.environ["SUPABASE_DB_URL"])
          # Comandos do GitHub Actions precisam sair na saída padrão (stdout).
          for value in {url.password or "", unquote(url.password or "")}:
              if value:
                  print(f"::add-mask::{value}")
          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)
          if url.scheme not in ("postgresql", "postgres"):
              fail("SUPABASE_DB_URL deve começar com postgresql://")
          if not url.password:
              fail("SUPABASE_DB_URL sem senha.")
          if url.port == 6543:
              fail("Porta 6543 (transaction pooler) não é compatível com migrações. Use o Session pooler (porta 5432).")
          print("Connection string válida (senha mascarada nos logs).")
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Migrações pendentes (simulação)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all
      - name: Aplicar migrações (sem seed)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
      - name: Histórico de migrações no banco
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
